name: Build and Deploy Aswenna to the production
 
on:
  push:
    branches:
      - Users/Nimsara/ASW-144-InvestorLandSearchSection
 
env:
  AZURE_WEBAPP_NAME: aswenna-frontend
  # DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: aswenna-portal-frontend
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
 
      
      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
 
      
      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
